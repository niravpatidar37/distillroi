# Ecosystem names verified against
# https://docs.github.com/en/code-security/dependabot/ecosystems-supported-by-dependabot/supported-ecosystems-and-repositories
version: 2
updates:
  - package-ecosystem: github-actions # SHA-pinned actions; Dependabot bumps the SHA and the version comment
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker # Dockerfile base images (pinned by digest)
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose # vLLM + Firestore emulator images (pinned by digest)
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: uv # pyproject.toml + uv.lock
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: terraform # hashicorp/google provider + lock files
    directories:
      - /infra/terraform/envs/staging
      - /infra/terraform/envs/prod
    schedule:
      interval: weekly
