# NOT RUN. Ready for a rented 24 GB GPU (e.g. L4/A10G): the guide's 7-8B student. QLoRA keeps it to ~8-10 GB VRAM.
# Same script: python scripts/train.py configs/train/qwen7b_r16_rented_gpu.yaml
name: qwen7b_r16
base_model: Qwen/Qwen2.5-7B-Instruct
revision: a09a35458c702b33eeacc393d103063234e8bc28
quantization: nf4   # nf4 = QLoRA (bitsandbytes 4-bit base, bf16 compute); none = plain LoRA
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
train:
  epochs: 3
  lr: 1.0e-4
  batch_size: 8      # micro-batch
  grad_accum: 2      # effective batch 16
  warmup_ratio: 0.05
  weight_decay: 0.0
  max_len: 144       # longest prompt is 126 tokens + label (<= 9) + <|im_end|>
  seed: 42
  grad_ckpt: true
  vram_cap_gb: 5.4   # allocator cap below the 6 GB card: OOM instead of silent WDDM spill
